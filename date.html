<div class="container">

    <h1>날짜·<em>디데이</em> 계산기</h1>
    <p class="subtitle">날짜 차이, 기념일, 디데이를 한번에 계산</p>
  </div>

  <div class="tabs">
    <button class="tab active" onclick="switchTab('diff',this)">📐 날짜 차이</button>
    <button class="tab" onclick="switchTab('dday',this)">⏳ 디데이</button>
    <button class="tab" onclick="switchTab('anniv',this)">💕 기념일</button>
  </div>

  <!-- 날짜 차이 -->
  <div id="tab-diff" class="card">
    <label>시작 날짜</label>
    <input type="date" id="startDate">
    <label>종료 날짜</label>
    <input type="date" id="endDate">
    <button class="btn" onclick="calcDiff()">📐 날짜 차이 계산</button>
  </div>

  <!-- 디데이 -->
  <div id="tab-dday" class="card hidden">
    <label>목표 날짜</label>
    <input type="date" id="ddayTarget">
    <button class="btn" onclick="calcDday()">⏳ 디데이 계산</button>
  </div>

  <!-- 기념일 -->
  <div id="tab-anniv" class="card hidden">
    <label>시작 날짜 (예: 연애 시작일)</label>
    <input type="date" id="anniversaryStart">
    <button class="btn" onclick="calcAnniversary()">💕 기념일 계산</button>
  </div>

  <div class="result-card" id="resultCard">
    <div class="big-result">
      <div class="big-num" id="bigNum">—</div>
      <div class="big-unit" id="bigUnit">—</div>
    </div>
    <div class="anniv-grid" id="annivGrid" style="display:none"></div>
  </div>

  <div class="ad-mid">📢 AdSense 광고 영역 (300×250)</div>

  <div class="info-card">
    <h2>날짜 계산기 활용법</h2>
    <p>날짜 차이 계산기는 두 날짜 사이의 정확한 일수를 계산합니다. 디데이 계산기는 시험, 여행, 결혼식 등 중요한 날까지 남은 날짜를 알려줍니다. 기념일 계산기는 연애 시작일부터 100일, 200일, 1주년 등 기념일 날짜를 자동으로 계산합니다.</p>

<script>
  const today = new Date();
  const todayStr = today.toISOString().split('T')[0];
  document.getElementById('startDate').value = todayStr;
  document.getElementById('endDate').value = todayStr;
  document.getElementById('ddayTarget').value = todayStr;
  document.getElementById('anniversaryStart').value = todayStr;

  function switchTab(name, btn) {
    document.querySelectorAll('.tab').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    ['diff','dday','anniv'].forEach(t => {
      document.getElementById('tab-'+t).classList.toggle('hidden', t !== name);
    });
    document.getElementById('resultCard').classList.remove('show');
  }

  function showResult(num, unit, gridHTML) {
    document.getElementById('bigNum').textContent = num;
    document.getElementById('bigUnit').textContent = unit;
    const ag = document.getElementById('annivGrid');
    if (gridHTML) { ag.style.display='grid'; ag.innerHTML=gridHTML; }
    else ag.style.display='none';
    const rc = document.getElementById('resultCard');
    rc.classList.add('show');
    rc.scrollIntoView({behavior:'smooth',block:'start'});
  }

  function calcDiff() {
    const s = new Date(document.getElementById('startDate').value);
    const e = new Date(document.getElementById('endDate').value);
    if (isNaN(s)||isNaN(e)) return alert('날짜를 선택해주세요.');
    const diff = Math.abs(Math.round((e-s)/86400000));
    showResult(diff.toLocaleString(), `일 (${Math.floor(diff/365)}년 ${Math.floor((diff%365)/30)}개월 ${diff%30}일)`);
  }

  function calcDday() {
    const t = new Date(document.getElementById('ddayTarget').value);
    const now = new Date(); now.setHours(0,0,0,0);
    const diff = Math.round((t-now)/86400000);
    if (diff === 0) showResult('D-DAY', '🎉 오늘이 바로 그날!');
    else if (diff > 0) showResult(`D-${diff}`, `${t.toLocaleDateString('ko-KR')} 까지 ${diff}일 남았습니다`);
    else showResult(`D+${Math.abs(diff)}`, `목표일로부터 ${Math.abs(diff)}일 지났습니다`);
  }

  function calcAnniversary() {
    const s = new Date(document.getElementById('anniversaryStart').value);
    if (isNaN(s)) return alert('날짜를 선택해주세요.');
    const milestones = [100,200,365,500,1000,1500,2000];
    let html = '';
    milestones.forEach(m => {
      const d = new Date(s.getTime() + (m-1)*86400000);
      const dayStr = d.toLocaleDateString('ko-KR');
      const diff = Math.round((d - new Date().setHours(0,0,0,0))/86400000);
      const badge = diff < 0 ? `<span style="color:#9ca3af">지남</span>` : diff === 0 ? `<span style="color:#f59e0b">오늘!</span>` : `<span style="color:#818cf8">D-${diff}</span>`;
      html += `<div class="anniv-item"><div class="anniv-d">${m}일</div><div class="anniv-label">${dayStr}</div><div style="font-size:11px;margin-top:4px">${badge}</div></div>`;
    });
    const days = Math.round((new Date()-s)/86400000)+1;
    showResult(days.toLocaleString(), `일째 함께 💕`, html);
  }
</script>
